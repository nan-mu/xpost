[package]
name = "xpost-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Foreground USB control service and HTTP client"

# Independent host workspace (parent defaults to RV32).
[workspace]

[[bin]]
name = "xpost-agent"
path = "src/main.rs"

[features]
test-device = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["timeout"] }
object = { version = "0.36", default-features = false, features = ["read", "elf"] }
tempfile = "3"
xpost-elf = { path = "../xpost-elf" }
xpost-serial = { path = "../xpost-serial", default-features = false, features = ["client"] }

[dev-dependencies]
heapless = "0.9"

[profile.release]
lto = false
