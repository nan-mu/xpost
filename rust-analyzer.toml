# rust-analyzer for the xpost workspace.
#
# Crate is RV32-only (inline asm / fence.i / link sections). Analyze with the
# MCU target; host stubs via target_arch are gone.

[cargo]
target = "riscv32imc-unknown-none-elf"
# `dev` alone lacks CAS on RV32IMC; esp-hal (via dev-c3) supplies it.
features = ["dev-c3"]

[check]
allTargets = false
workspace = false
