# rust-analyzer for the xpost MCU lib + linked firmware / host workspaces.
#
# Do NOT set `[cargo].target` here — it applies to every linked project under
# this tree. Host crates (xpost-serial / xpost-agent) must use their own
# `.cargo/config.toml` (aarch64-*), while MCU crates keep RV32 via theirs.
#
# Discover separate Cargo workspaces via `.vscode/settings.json` →
# `rust-analyzer.linkedProjects`, plus `scripts/ra-check.sh` as
# check/buildScripts override (cwd-aware: `-p xpost` at root, else local check).
#
# Do not put `[procMacro]` here — rust-analyzer.toml rejects it
# (`procMacro/enable: unexpected field`) and the proc-macro server then exits 101.
#
# Omit `xpost-test` from linkedProjects on Mac: its rust-toolchain is a docker
# shim that remaps `cargo metadata` paths to `~/.cache/xpost-test-docker/`,
# which breaks RA against the files you edit in-tree.

[cargo]
features = []
allTargets = false

[check]
allTargets = false
workspace = false
