# rust-analyzer for the xpost MCU lib.
#
# Root `.cargo/config.toml` defaults to RV32. Host packages (agent/xtask/
# xpost-build/examples) are workspace.exclude — do not set `files.exclude`
# here (server rejects it).
#
# Do not put `[procMacro]` here — rust-analyzer.toml rejects it
# (`procMacro/enable: unexpected field`) and the proc-macro server then exits 101.
# Proc-macro is on by default; `.vscode/settings.json` can still set cargo/check
# overrideCommand so RA loads the host `xpost-macros` dylib.

[cargo]
target = "riscv32imc-unknown-none-elf"
features = []
allTargets = false

[check]
allTargets = false
workspace = false
overrideCommand = [
    "cargo",
    "check",
    "-p",
    "xpost",
    "--target",
    "riscv32imc-unknown-none-elf",
    "--message-format=json",
]
