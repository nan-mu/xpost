# rust-analyzer for the xpost MCU lib + linked firmware examples.
#
# Root `.cargo/config.toml` defaults to RV32. Host packages (xpost-agent /
# xpost-build / …) stay workspace.exclude — do not set `files.exclude`
# here (server rejects it).
#
# Firmware examples are separate Cargo workspaces (own `[workspace]`).
# Discover them via `.vscode/settings.json` → `rust-analyzer.linkedProjects`
# plus `scripts/ra-check.sh` as check/buildScripts override (cwd-aware so
# `-p xpost` at root still applies, while examples typecheck themselves).
#
# Do not put `[procMacro]` here — rust-analyzer.toml rejects it
# (`procMacro/enable: unexpected field`) and the proc-macro server then exits 101.

[cargo]
target = "riscv32imc-unknown-none-elf"
features = []
allTargets = false

[check]
allTargets = false
workspace = false
