[workspace]

[package]
edition      = "2024"
name         = "exec_bench_hal"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "exec_bench_hal"
path = "./src/bin/main.rs"

[package.metadata.espflash]
partition_table = "partitions.csv"

# Slot + cold table so xpost links; HAL never leases a compute image.
[package.metadata.xpost]
schema_version = 1

[[package.metadata.xpost.slots.entries]]
name = "a"
length = 0xE00
mount = "rx"
primary = true

[package.metadata.xpost.xdp_table]
partition = "xdp"
image_capacity = 0x1000

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }
# `esp-radio` feature required: root `xpost` always links esp-radio.
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log = "0.4.27"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
critical-section = "1.2.0"
heapless = "0.8"
xpost = { path = "../..", features = [
  "perf-counter",
  "perf-aggregate",
  "perf-gauge",
  "perf-trace",
] }
xpost-serial = { path = "../../xpost-serial", default-features = false, features = ["server"] }
exec_bench_common = { path = "../exec_bench_common" }

[build-dependencies]
xpost-build = { path = "../../xpost-build" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
