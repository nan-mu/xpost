[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3"
rustflags = [
  "-C", "force-frame-pointers",
  "-Z", "stack-protector=all",
]

[env]
ESP_LOG = "info"

[build]
target = "riscv32imc-unknown-none-elf"

[alias]
build-hal = "build --release --target riscv32imc-unknown-none-elf -Zbuild-std=core,alloc"
build-hal-all = "run --package hal-build --target host-tuple --"
