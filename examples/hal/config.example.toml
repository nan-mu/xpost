# Pure ESP-HAL STA UDP echo (no XDP / FirewallDevice). Profile: base-hal → bare_hal.
schema_version = 1

[wifi]
ssid = "your_wifi_ssid"
password = "your_wifi_password"

[probe]
ip = "192.168.110.142"
reply_port = 18080

[dut]
listen_port = 8080
ctrl_port = 8081

[[tests]]
name = "bare_echo"
enabled = true
