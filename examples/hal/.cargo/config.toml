[env]
ESP_LOG = "info"
ESP_RADIO_CONFIG_WIFI_MAX_BURST_SIZE = "16"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --no-addresses --chip esp32c3 --partition-table partitions.csv"
rustflags = [
  "-C", "force-frame-pointers",
  "-C", "link-arg=--wrap=esp_wifi_internal_free_rx_buffer",
]

[build]
target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["core", "alloc"]

[alias]
fwrun = "run --release"
