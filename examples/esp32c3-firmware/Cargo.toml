[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
edition      = "2024"
name         = "esp32c3_firmware"
rust-version = "1.88"
version      = "0.1.1"
publish      = false

[lib]
test = false
bench = false

[[bin]]
name = "esp32c3_firmware"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
critical-section = "1.2.0"
static_cell      = { version = "2.1.1", features = ["nightly"] }
embassy-futures = "0.1.2"
xpost = { path = "../.." }
allocator-api2 = { version = "0.4", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17", default-features = false, features = ["allocator-api2", "default-hasher"] }
talc = { version = "5.0", features = ["counters"] }
ringbuf = { version = "0.3.3", default-features = false }

[build-dependencies]
xpost-build = { path = "../../xpost-build" }

[package.metadata.espflash]
partition_table = "partitions.csv"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
