[workspace]

[package]
edition      = "2024"
name         = "just_drop"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "just_drop"
path = "./src/bin/main.rs"

[package.metadata.espflash]
partition_table = "partitions.csv"

# Single-slot board override (xpost library metadata still lists optional slot b).
[package.metadata.xpost]
schema_version = 1

[[package.metadata.xpost.slots.entries]]
name = "a"
length = 0xE00
mount = "rx"
primary = true

[package.metadata.xpost.xdp_table]
partition = "xdp"
image_capacity = 0x1000

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", path = "../../esp-radio", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
xpost = { path = "../.." }
critical-section = "1.2.0"
static_cell      = "2.1.1"

[build-dependencies]
xpost-build = { path = "../../xpost-build" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
