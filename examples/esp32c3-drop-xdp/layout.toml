# IRAM layout intent for xdp-mcu (ESP32-C3 / RV32IMC).
# After edits run `cargo xtask doctor` (writes mem.toml). Do not edit mem.toml by hand.

[arena]
iram_base = 0x40380000
arena_end = 0x40382000

[helper]
length = 0x200

# Slot names sorted → IRAM order. mount = call|rx (call may repeat; rx ≤1).
[slots]
a = { length = 0xE00, mount = "rx" }
b = { length = 0x1000, mount = "call" }
