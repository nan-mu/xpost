[workspace]

[package]
edition      = "2024"
name         = "case_xdp"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "case_xdp"
path = "./src/bin/main.rs"

[package.metadata.espflash]
partition_table = "partitions.csv"

# Slot `a` is the leased entry. Slot `b` is staged, then published by activate.
[package.metadata.xpost]
schema_version = 1

[[package.metadata.xpost.slots.entries]]
name = "a"
length = 0xE00
mount = "rx"
primary = true

[[package.metadata.xpost.slots.entries]]
name = "b"
length = 0xE00
mount = "call"
primary = false

[package.metadata.xpost.xdp_table]
partition = "xdp"
image_capacity = 0x1000

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "log",
  "medium-ethernet",
  "proto-ipv4",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", path = "../../esp-radio", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
  "xdp",
] }
xpost = { path = "../..", features = ["esp-radio"] }
xpost-serial = { path = "../../xpost-serial", default-features = false, features = ["server"] }
critical-section = "1.2.0"
portable-atomic = { version = "1", default-features = false }
static_cell      = "2.1.1"

[features]
perf-cag = ["xpost/perf-counter", "xpost/perf-aggregate", "xpost/perf-gauge"]
perf-t = ["xpost/perf-counter", "xpost/perf-trace"]

[build-dependencies]
xpost-build = { path = "../../xpost-build" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
