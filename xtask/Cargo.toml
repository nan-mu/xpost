[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"], optional = true }
toml = "1.1.3"
