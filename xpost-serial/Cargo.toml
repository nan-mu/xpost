[package]
name = "xpost-serial"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Host serial/flash backend for xpost-agent (USB-UART + espflash)"

# Independent host workspace (parent defaults to RV32).
[workspace]

[dependencies]
anyhow = "1"
esp-idf-part = "0.6"
espflash = { version = "4.6", default-features = false, features = ["serialport"] }
log = "0.4"
serialport = "4.6"
thiserror = "2"
xpost-elf = { path = "../xpost-elf" }

[dev-dependencies]
heapless = "0.9"
tempfile = "3"
