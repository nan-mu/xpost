[workspace]
authors = ["nan-mu <mu.nan.11@outlook.com>"]
channels = ["conda-forge"]
name = "benchmark"
platforms = ["osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
pandas = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
ipykernel = "*"
python-dotenv = "*"
psycopg = { version = ">=3", extras = ["binary"] }
sqlalchemy = "*"
nbformat = ">=5.11.1, <6"
nbclient = ">=0.11.0, <0.12"

[tasks]
figures = "python -m analysis refresh"
replay = "python -m analysis build"
check = "python -m unittest discover -s tests -v"
