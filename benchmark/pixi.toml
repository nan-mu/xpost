[workspace]
authors = ["nan-mu <mu.nan.11@outlook.com>"]
channels = ["conda-forge"]
name = "benchmark"
platforms = ["osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
pandas = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
ipykernel = "*"
python-dotenv = "*"
psycopg = { version = ">=3", extras = ["binary"] }
sqlalchemy = "*"

[tasks]
# Optional: register pixi Python for ad-hoc notebooks / REPL.
kernel = { cmd = "python -m utils.install_kernel", cwd = "." }
