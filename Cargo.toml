[workspace]
resolver = "2"
members = [".", "xdp-mcu", "xtask"]
default-members = ["."]

[package]
edition      = "2024"
name         = "firmware"
rust-version = "1.88"
version      = "0.1.1"

[lib]
test = false
bench = false

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"
test = false
bench = false


[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
critical-section = "1.2.0"
static_cell      = { version = "2.1.1", features = ["nightly"] }
embassy-futures = "0.1.2"
xdp-mcu = { path = "xdp-mcu" }
# hwtest pool probes (cfg fw_us_hw_selftest)
allocator-api2 = { version = "0.4", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17", default-features = false, features = ["allocator-api2", "default-hasher"] }
talc = { version = "5.0", features = ["counters"] }
ringbuf = { version = "0.3.3", default-features = false }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[build-dependencies]
xtask = { path = "xtask", default-features = false }

[package.metadata.espflash]
partition_table = "partitions.csv"
