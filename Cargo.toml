[workspace]
resolver = "2"
members = [".", "xpost-build", "xpost-macros", "xtask", "agent"]
default-members = ["."]

[package]
edition      = "2024"
name         = "xpost"
rust-version = "1.88"
version      = "0.1.1"
description  = "XDP datapath on MCU (express post): AOT invoke, maps, helpers, RX ingest"
license      = "MIT OR Apache-2.0"
publish      = false
links        = "xpost"
exclude      = ["examples/*", "xtask", "xpost-build", "target"]

[lib]
test = false
bench = false

[features]
# Compile detailed XDP ingress diagnostics. Kept out of normal firmware builds
# because every message is on a packet-path or lifecycle boundary.
debug = []
esp32c3-storage = ["dep:embedded-storage", "dep:esp-storage", "esp-storage/esp32c3"]
esp32c3-radio = ["dep:esp-hal", "dep:esp-radio"]
# Host-safe development: typecheck ingress flight scaffolding (asm stubbed).
# Does NOT enable esp-hal — that forces `portable-atomic/unsafe-assume-single-core`,
# which fails on aarch64/x86_64 hosts.
dev = ["debug"]
# MCU development: radio + storage + ingress. Use with riscv32 target only
# (`cargo check-c3`). Not for host `cargo check --features dev-c3`.
dev-c3 = ["dev", "esp32c3-radio", "esp32c3-storage"]
# Incomplete — do not enable (compile_error!). PERCPU not implemented.
multicore = []
# Incomplete — do not enable (compile_error!). Hot switch/save/switch unimplemented.
hot-switch = []
# Incomplete — do not enable (compile_error!).
# Pulls optional ringbuf / async-ringbuf crates; source kept for later work.
ringbuf = ["dep:ringbuf", "dep:async-ringbuf"]
# Boot maps/XDP images from board bpf.toml codegen (`Builder::from_bpf_toml`).
# Mutually exclusive with `xdp-firmware-first`.
from-bpf-toml = []
# Default / firmware-first path (no bpf boot tables). Mutually exclusive with `from-bpf-toml`.
xdp-firmware-first = []

[package.metadata.rust-analyzer]
# Prefer `rust-analyzer.toml` in this crate.
features = ["dev"]

# Default MCU layout sizes for path A (xpost-build sync / declare_runtime!).
[package.metadata.xpost]
schema_version = 1

[package.metadata.xpost.map]
heap_size = 65536

[[package.metadata.xpost.slots.entries]]
name = "a"
length = 0xE00
mount = "rx"
primary = true

[[package.metadata.xpost.slots.entries]]
name = "b"
length = 0x1000
mount = "call"
primary = false

[package.metadata.xpost.xdp_table]
flash_base = 0
flash_len = 0x2000
image_capacity = 0x1000
image_count = 2

[package.metadata.xpost.target]
arch = "riscv32"
abi = "ilp32"
iram_base = 0x40380000
arena_end = 0x40382000
helper_length = 0x200


[dependencies]
xpost-macros     = { path = "xpost-macros" }
log              = "0.4.27"
anyhow           = { version = "1.0.104", default-features = false }
critical-section = "1.2.0"
heapless         = "0.9.3"
nom              = { version = "8.0.0", default-features = false, features = ["alloc"] }
talc             = { version = "5.0", features = ["counters"] }
allocator-api2   = { version = "0.4", default-features = false, features = ["alloc"] }
allocator-api2-v02 = { version = "0.2", package = "allocator-api2", default-features = false, features = ["alloc"] }
hashbrown        = { version = "0.17", default-features = false, features = ["allocator-api2", "default-hasher"] }
portable-atomic  = { version = "1", default-features = false }
ringbuf          = { version = "0.5.1", default-features = false, optional = true, features = ["alloc", "portable-atomic"] }
async-ringbuf    = { version = "0.3.8", default-features = false, optional = true, features = ["alloc", "portable-atomic"] }
embassy-time     = { version = "0.5.0", default-features = false, features = ["log"] }
embassy-sync     = { version = "0.8.0", default-features = false, features = ["log"] }
embedded-storage = { version = "0.3.1", optional = true }
esp-storage      = { version = "0.9.0", default-features = false, optional = true }
esp-hal = { version = "~1.1.0", default-features = false, optional = true, features = [
  "esp32c3",
  "unstable",
] }
esp-radio = { version = "0.18.0", default-features = false, optional = true, features = [
  "esp32c3",
  "unstable",
  "wifi",
] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
