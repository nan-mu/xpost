# ESP32-C3 patch IRAM map — firmware-side contract (mem_map.rs + custom-sections.x).
# AOT linker scripts live in libbpf-mcu (`make/linker/esp32c3*.ld`);
# this repo must NOT generate or overwrite them. Keep numbers in sync by hand.
#
# Patch arena is 8KiB at IRAM head (helper + HOT_A + HOT_B). DRAM dual-map is
# skipped via .rwdata_dummy_bs. Do NOT extend past 0x40382000 — that is .trap.
# Do NOT place hot windows at 0x403A1000 — aliases into .bss/.stack.

[helper]
# Absolute IRAM entry for `helper_dispatcher` (AOT `call helper_dispatcher`).
# Small trampoline window carved from the first 4KiB page (not a full page).
base = 0x40380000
length = 0x200

[hot_region_a]
# RX default entry slot (AOT `--slot=a`).
base = 0x40380200
length = 0xE00

[hot_region_b]
# Hot-replaceable / tail_call target slot (AOT `--slot=b`).
base = 0x40381000
length = 0x1000
