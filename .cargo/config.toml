[env]
ESP_LOG = "info"
ESP_RADIO_CONFIG_WIFI_MAX_BURST_SIZE = "16"
# Board dir for xpost build.rs (intent layout.toml / optional bpf.toml).
XPOST_BOARD = { value = "examples/esp32c3", relative = true }

# Lib is RV32-only (inline asm / IRAM sections). Host packages override via --target
# (see xtask alias). Matches examples/*/ .cargo/config.toml.
[build]
target = "riscv32imc-unknown-none-elf"

# RV32IMC has no A (CAS). ESP32-C3 is single-core; same cfg esp-hal would set.
[target.riscv32imc-unknown-none-elf]
rustflags = ["--cfg", "portable_atomic_unsafe_assume_single_core"]

[alias]
# Root dispatcher: cargo xtask sync | cargo xtask agent
# Host binary — must not inherit workspace RV32 `build.target`.
xtask = "run --manifest-path xtask/Cargo.toml --target aarch64-apple-darwin --"
# Flash the firmware example (from workspace root)
fwrun = "run -p firmware --release"
# Typecheck MCU lib (storage is always on).
check-c3 = "check -p xpost"
# Typecheck esp-radio native-XDP ingress via xpost (unifies esp-hal/unstable +
# esp-radio features esp32c3,wifi,unstable,xdp).
check-esp-radio-xdp = "check -p xpost"
