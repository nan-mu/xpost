# Compile-time xpost-test config (embedded into the binary via include_str!).
# Edit this file, rebuild, scp the single `xpost-test` binary to TR3000, then:
#   ./xpost-test                 # runs [default_bench] (just-drop-pps, formal performance)
#   ./xpost-test serve           # HTTP daemon (remote jobs via scripts/fwctl.sh)
#   ./xpost-test suite --json
#   ./xpost-test --help-benches
# Mac side only needs: cargo xtask agent --listen 0.0.0.0:9240 --no-monitor
# (--smoke is DEBUG-only / hidden; do not use for formal performance runs)
#
# 本文件启用的 [[tests]].name 必须与 firmware/config.toml 的 [[tests]] 同名。

default_bench = "just-drop-pps"

[just_drop_pps]
formal = true
rounds = 3
sample_interval_ms = 1000
arms = ["hal", "xdp"]

[probe]
iface = "br-lan"
pair_timeout_ms = 5000
report_path = "/tmp/test-report.json"
# Optional Ethernet source MAC override (default: iface hardware address)
# src_mac = "00:11:22:33:44:55"

[target]
esp_ip = "192.168.110.106"
vip_ip = "192.168.110.200"
# From firmware `[Init][STA] mac=…`
esp_mac = "dc:1e:d5:e5:e0:c8"
echo_port = 8080
reply_port = 18080
# Stimulus UDP sport; must ≠ reply_port (bounce swaps ports; TC uses dport!=reply).
stim_sport = 18081
ctrl_port = 8081
# Must match firmware [[tests.seeds]] for test0 (idx0 DROP, idx1 XDP_TX).
ban_ip = "10.0.0.1"
tx_ip = "10.0.0.2"

# Mac USB flash agent on LAN (TR3000 → Mac IP:9240, no SSH tunnel).
# Runtime override on TR3000: XPOST_AGENT_ENDPOINT=<mac-ip>:9240 ./xpost-test
[agent]
endpoint = "192.168.110.96:9240"

[serve]
http_listen = "0.0.0.0:19081"

[profiles]
drop_hal = "drop-hal"
drop_xdp = "drop-xdp"
firmware = "firmware"
just_drop = "just-drop"
just_drop_hal = "just-drop-hal"

[[tests]]
name = "test0"
enabled = true

[[tests.cases]]
id = "drop"
src_ip = "10.0.0.1"

[[tests.cases]]
id = "tx"
src_ip = "10.0.0.2"
expect_bounce = true
