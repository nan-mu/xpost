# firewall / firewall_hal formal knobs (compile-time embed).
# Selected via default.toml `run = ["firewall"]`.
#
# Hash-map blacklist fixed at 200. Each CAG cell mixes illegal traffic at the
# pps grid for 30s with exactly `legal_packets` unique LE u16 tokens on a miss
# source IP. Legal delivery is read via virtual map `firewall_result`.

formal = true
arms = ["hal", "xdp"]
blacklist_size = 200
# The sender ignores this count. Each window paces one stream at the target rate.
# Every 10th packet is a unique legal token. The device cap is 16384.
legal_packets = 1024
