# Compile-time xpost-test defaults (embedded via include_str!).
# TR3000 path: rebuild, scp binary, then always:
#   ./xpost-test
# No env vars, no CLI flags. Edit `run` to choose which experiments run.
#
# Start the Mac daemon with xpost-agent start --bind 0.0.0.0:9240.
# The runner connects via HTTP. Set endpoint to host:port or a URL.
#
# Medium status and release audit: see procedures/medium.md.
# Debug: run = ["dev"] — HAL smoke for just_tx/just_drop/firewall (no XDP, no DB).
# Wipe: run = ["formal-clear"] → TRUNCATE exam CASCADE.

version = "1"

# Use a separate run list for older experiments or diagnostics.
# Medium checks Agent deployment readiness before device writes or database access.
run = ["medium"]
# medium_resume_id = "<original campaign UUID>"

[postgres]
host = "192.168.110.96"
port = 5432
user = "nan"
password = "22332233"
dbname = "postgres"
formal_schema = "formal"
# Medium uses a separate database initialized with sql/protocol_v1.sql.
protocol_dbname = "xpost_medium"

[agent]
endpoint = "192.168.110.96:9240"

[probe]
iface = "br-lan"
# Optional Ethernet source MAC override (default: iface hardware address)
# src_mac = "00:11:22:33:44:55"

[dut]
esp_ip = "192.168.110.106"
vip_ip = "192.168.110.200"
# From firmware `[Init][STA] mac=…`
esp_mac = "dc:1e:d5:e5:e0:c8"
echo_port = 8080
reply_port = 18080
# Stimulus UDP sport; must ≠ reply_port (bounce swaps ports; TC uses dport!=reply).
stim_sport = 18081
