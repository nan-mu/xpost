# Compile-time xpost-test defaults (embedded via include_str!).
# TR3000 formal path: rebuild, scp binary, then always:
#   ./xpost-test
# No env vars, no CLI flags. Edit this file to choose which benches run.
#
# Mac side: cargo xtask agent --listen 0.0.0.0:9240 --no-monitor
#
# Experiment knobs live in just_tx.toml / just_drop.toml.
# Suite [[tests]].name must match firmware/config.toml [[tests]] names.

version = "1"

# Ordered benches for bare `./xpost-test`.
# One experiment:  run = ["just-tx-rtt"]
# All formal A/B:  run = ["just-drop-pps", "just-tx-pps", "just-tx-rtt"]
run = ["just-tx-rtt"]

[postgres]
host = "192.168.110.96"
port = 5432
user = "nan"
password = "22332233"
dbname = "postgres"
formal_schema = "formal"

[agent]
endpoint = "192.168.110.96:9240"

[probe]
iface = "br-lan"
pair_timeout_ms = 5000
report_path = "/tmp/test-report.json"
# Optional Ethernet source MAC override (default: iface hardware address)
# src_mac = "00:11:22:33:44:55"

[dut]
esp_ip = "192.168.110.106"
vip_ip = "192.168.110.200"
# From firmware `[Init][STA] mac=…`
esp_mac = "dc:1e:d5:e5:e0:c8"
echo_port = 8080
reply_port = 18080
# Stimulus UDP sport; must ≠ reply_port (bounce swaps ports; TC uses dport!=reply).
stim_sport = 18081
ctrl_port = 8081

[serve]
http_listen = "0.0.0.0:19081"

[profiles]
drop_hal = "drop-hal"
drop_xdp = "drop-xdp"
firmware = "firmware"
just_drop = "just-drop"
just_drop_hal = "just-drop-hal"
just_tx = "just-tx"
just_tx_hal = "just-tx-hal"

[[tests]]
name = "test0"
enabled = true

[[tests.cases]]
id = "drop"
src_ip = "10.0.0.1"

[[tests.cases]]
id = "tx"
src_ip = "10.0.0.2"
expect_bounce = true
