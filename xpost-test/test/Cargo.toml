[package]
name = "test"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
test-common = { path = "../test-common", features = ["user"] }
test-report = { path = "../test-report" }

anyhow = { workspace = true, default-features = true }
axum = { workspace = true }
aya = { workspace = true }
aya-log = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "io-std",
  "macros",
  "rt",
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "time",
  "process",
] }
toml = { workspace = true }
rand = "0.10.2"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
test-ebpf = { path = "../test-ebpf" }

[[bin]]
name = "probe"
path = "src/main.rs"
