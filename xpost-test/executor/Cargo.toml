[package]
name = "executor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "executor"
path = "src/main.rs"

[dependencies]
test-common = { path = "../test-common", features = ["host"] }
anyhow = { workspace = true, default-features = true }
axum = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "io-std",
  "macros",
  "rt",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "process",
] }
toml = { workspace = true }
