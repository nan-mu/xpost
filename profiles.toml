# xpost-agent profile registry (paths relative to XPOST_ROOT / repo root).
#
# Firmware build features select the collection variant.
# Firmware builds use Cargo commands from each firmware profile.
# The Agent fetches XDP ELFs from the pinned release.

# Pinned libbpf-mcu release. Each [[xdp]] names a program and a mode.
xdp_release = "v0.1.1"

# ---------------------------------------------------------------------------
# just_tx (examples/just_xdp; co-flash uses the aot container)
# ---------------------------------------------------------------------------

[[fw]]
name = "just-tx-metrics"
target = "esp32c3"
partition_table = "examples/just_xdp/partitions.csv"
artifact = "examples/just_xdp/target/riscv32imc-unknown-none-elf/release/just_xdp"
build = { cwd = "examples/just_xdp", command = ["cargo", "build", "--release", "--features", "perf-metrics"] }
xdp = ["just_tx"]

[[fw]]
name = "just-tx-trace"
target = "esp32c3"
partition_table = "examples/just_xdp/partitions.csv"
artifact = "examples/just_xdp/target/riscv32imc-unknown-none-elf/release/just_xdp"
build = { cwd = "examples/just_xdp", command = ["cargo", "build", "--release", "--features", "perf-trace"] }
xdp = ["just_tx"]

