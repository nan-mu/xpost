# ---------------------------------------------------------------------------
# XDP containers. `program` is the producer stem (`-c`); `mode` is aot, jit, or rbpf.
# The Agent selects the indexed deployment from the release archive.
# Metrics and Trace firmware can co-install the same release program.
# ---------------------------------------------------------------------------

[[xdp]]
name = "just_tx"
fw = "just-tx-metrics"
program = "just_tx"
mode = "aot"

[[xdp]]
name = "just_drop"
fw = "just-drop-metrics"
program = "just_drop"
mode = "aot"

[[xdp]]
name = "firewall"
fw = "firewall-metrics"
program = "firewall"
mode = "aot"

# ---------------------------------------------------------------------------
# EXB2 deployment profiles. Board-side EXB2 transport is pending.
# ---------------------------------------------------------------------------

[[fw]]
name = "exec-bench-aot"
target = "esp32c3"
partition_table = "examples/exec_bench/partitions.csv"
xdp_image_capacity = 0x4000
artifact = "examples/exec_bench/target/riscv32imc-unknown-none-elf/release/exec_bench"
build = { cwd = "examples/exec_bench", command = ["cargo", "build", "--release"] }
xdp = ["noop"]

[[fw]]
name = "exec-bench-rbpf"
target = "esp32c3"
partition_table = "examples/exec_bench/partitions.csv"
xdp_image_capacity = 0x4000
artifact = "examples/exec_bench/target/rbpf/riscv32imc-unknown-none-elf/release/exec_bench"
build = { cwd = "examples/exec_bench", command = ["cargo", "build", "--release", "--features", "interp", "--target-dir", "target/rbpf"] }
xdp = ["noop_rbpf"]

[[fw]]
name = "exec-bench-hal"
target = "esp32c3"
partition_table = "examples/exec_bench_hal/partitions.csv"
artifact = "examples/exec_bench_hal/target/riscv32imc-unknown-none-elf/release/exec_bench_hal"
