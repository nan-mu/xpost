# xpost-agent profile registry (paths relative to XPOST_ROOT / repo root).
#
# Schema:
#
#   [[fw]]
#   name = "…"
#   target = "esp32c3"
#   partition_table = "examples/…/partitions.csv"
#   artifact = "examples/…/target/…/release/…"
#   build = { cwd = "…", command = ["cargo", …] }
#   xdp = ["xdp_name", …]          # optional; co-flashed after fw
#
#   [[xdp]]
#   name = "…"
#   fw = "fw_name"                 # must match an [[fw]].name
#   artifact = "build/<stem>/<stem>.elf"
#   build = { cwd = "…", command = ["pixi", "run", "build", "--firmware", "…", "-c", "…"] }
#   # target optional; if set must match linked fw
#
# HTTP: POST /v1/flash/fw|xdp  {"name":"…"}

# ---------------------------------------------------------------------------
# exec_bench — function-call eBPF vs native HAL (no Wi-Fi; mcycle via UART)
# ---------------------------------------------------------------------------

[[fw]]
name = "exec-bench-ebpf"
target = "esp32c3"
partition_table = "examples/exec_bench/partitions.csv"
artifact = "examples/exec_bench/target/riscv32imc-unknown-none-elf/release/exec_bench"
build = { cwd = ".", command = ["cargo", "xtask", "exec_bench", "build", "--release"] }
xdp = ["exec_bench"]

[[xdp]]
name = "exec_bench"
fw = "exec-bench-ebpf"
artifact = "examples/exec_bench/exec_bench.elf"
build = { cwd = "examples/exec_bench/ebpf", command = ["./build.sh"] }

[[fw]]
name = "exec-bench-hal"
target = "esp32c3"
partition_table = "examples/exec_bench_hal/partitions.csv"
artifact = "examples/exec_bench_hal/target/riscv32imc-unknown-none-elf/release/exec_bench_hal"
build = { cwd = ".", command = ["cargo", "xtask", "exec_bench_hal", "build", "--release"] }
