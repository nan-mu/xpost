# ---------------------------------------------------------------------------
# case_xdp — one firmware for both exams.
# Cold `case` clears and reflashes one image, then reboots.
# `hot_swap` installs case_swap and case_mark_idle, then publishes without reboot.
# xdp is empty so flash/fw does not pin an image.
# The shared case firmware has no per-packet collection features.
# ---------------------------------------------------------------------------

[[fw]]
name = "case-xdp"
target = "esp32c3"
partition_table = "examples/case_xdp/partitions.csv"
artifact = "examples/case_xdp/target/riscv32imc-unknown-none-elf/release/case_xdp"
build = { cwd = "examples/case_xdp", command = ["cargo", "build", "--release"] }
xdp = []

[[xdp]]
name = "case_swap"
fw = "case-xdp"
program = "case_swap"
mode = "aot"

[[xdp]]
name = "case_mark"
fw = "case-xdp"
program = "case_mark"
mode = "aot"

[[xdp]]
name = "case_mark_idle"
fw = "case-xdp"
program = "case_mark"
mode = "aot"
slot = 1

[[fw]]
name = "just-tx-rbpf"
target = "esp32c3"
partition_table = "examples/just_xdp/partitions.csv"
artifact = "examples/just_xdp/target/rbpf/riscv32imc-unknown-none-elf/release/just_xdp"
build = { cwd = "examples/just_xdp", command = ["cargo", "build", "--release", "--features", "perf-metrics,interp", "--target-dir", "target/rbpf"] }
xdp = ["just_tx_rbpf"]

[[fw]]
name = "just-drop-rbpf"
target = "esp32c3"
partition_table = "examples/just_xdp/partitions.csv"
