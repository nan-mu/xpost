# xpost-agent profile registry (paths relative to XPOST_ROOT / repo root).
#
# Formal firmware tags (DB `firmware` enum — not Cargo feature names):
#   xdp_cag → perf-cag (counter+aggregate+gauge)
#   xdp_t   → perf-t   (counter+trace)
#   hal     → examples/*_hal with local CAG report (no xpost runtime; Trace is XDP-only)
#
# Firmware build: cwd = examples/<project>, `cargo build --release --features …`.

# ---------------------------------------------------------------------------
# just_tx (examples/just_xdp + cold just_tx.elf)
# ---------------------------------------------------------------------------

[[fw]]
name = "just-tx-cag"
target = "esp32c3"
partition_table = "examples/just_xdp/partitions.csv"
artifact = "examples/just_xdp/target/riscv32imc-unknown-none-elf/release/just_xdp"
build = { cwd = "examples/just_xdp", command = ["cargo", "build", "--release", "--features", "perf-cag"] }
xdp = ["just_tx"]

[[fw]]
name = "just-tx-t"
target = "esp32c3"
partition_table = "examples/just_xdp/partitions.csv"
artifact = "examples/just_xdp/target/riscv32imc-unknown-none-elf/release/just_xdp"
build = { cwd = "examples/just_xdp", command = ["cargo", "build", "--release", "--features", "perf-t"] }
xdp = ["just_tx"]

