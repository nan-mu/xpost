# Profile registry for Mac `xpost-agent` FlashProfile (paths relative to xpost/).
# `build` is argv run from XPOST_ROOT before flash so Mac only needs:
#   cargo xtask agent --listen 0.0.0.0:9240 --no-monitor
# (HTTP /v1/flash_profile + /mcp on that port)
#
# just_drop kinds: separate compile features (kind-c/a/g/t) so backends do not
# poison each other. Legacy ids `just-drop` / `just-drop-hal` ≡ kind-c.

[[profile]]
id = "just-drop"
path = "just_drop"
description = "just_drop Counter (kind-c) + cold just_drop.elf"
bin = "examples/just_drop/target/riscv32imc-unknown-none-elf/release/just_drop"
partition_table = "examples/just_drop/partitions.csv"
chip = "esp32c3"
xdp_elf = "examples/just_drop/just_drop.elf"
xdp_name = "just_drop"
build = ["cargo", "xtask", "just_drop", "build", "--release", "--no-default-features", "--features", "kind-c"]

