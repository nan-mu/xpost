# ---------------------------------------------------------------------------
# XDP images (name must equal ELF-derived stem). Canonical fw = *-cag;
# *-t shares the same partition_table and may co-flash the same xdp.
# ---------------------------------------------------------------------------

[[xdp]]
name = "just_tx"
fw = "just-tx-cag"
artifact = "../build/just_tx/just_tx.elf"
build = { cwd = "../libbpf-mcu", command = ["pixi", "run", "build", "--firmware", "../xpost/examples/just_xdp/target/riscv32imc-unknown-none-elf/release/just_xdp", "-c", "just_tx"] }

[[xdp]]
name = "just_drop"
fw = "just-drop-cag"
artifact = "../build/just_drop/just_drop.elf"
build = { cwd = "../libbpf-mcu", command = ["pixi", "run", "build", "--firmware", "../xpost/examples/just_xdp/target/riscv32imc-unknown-none-elf/release/just_xdp", "-c", "just_drop"] }

[[xdp]]
name = "firewall"
fw = "firewall-cag"
artifact = "../build/firewall/firewall.elf"
build = { cwd = "../libbpf-mcu", command = ["pixi", "run", "build", "--firmware", "../xpost/examples/firewall/target/riscv32imc-unknown-none-elf/release/firewall", "-c", "firewall"] }
