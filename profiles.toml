# Profile registry for Mac `xpost-agent` FlashProfile (paths relative to xpost/ cwd).

[[profile]]
id = "just-drop"
path = "just_drop"
description = "just_drop firmware + cold just_drop.elf (XDP ingress drop)"
bin = "examples/just_drop/target/riscv32imc-unknown-none-elf/release/just_drop"
partition_table = "examples/just_drop/partitions.csv"
chip = "esp32c3"
xdp_elf = "examples/just_drop/just_drop.elf"
xdp_name = "just_drop"

[[profile]]
id = "just-drop-hal"
path = "just_drop_hal"
description = "just_drop_hal firmware (app-layer UDP drop; serial `drop on`)"
bin = "examples/just_drop_hal/target/riscv32imc-unknown-none-elf/release/just_drop_hal"
partition_table = "examples/just_drop_hal/partitions.csv"
chip = "esp32c3"

[[profile]]
id = "drop-hal"
path = "hal_drop"
description = "Pure ESP-HAL ICMP drop counter (examples/esp32c3-drop-hal)"
bin = "examples/esp32c3-drop-hal/target/riscv32imc-unknown-none-elf/release/esp32c3_drop_hal"
partition_table = "examples/esp32c3-drop-hal/partitions.csv"
chip = "esp32c3"

[[profile]]
id = "drop-xdp"
path = "xdp_drop"
description = "Drop bench AOT (XDP_DROP only) + rxcnt (examples/esp32c3-drop-xdp)"
bin = "examples/esp32c3-drop-xdp/target/riscv32imc-unknown-none-elf/release/esp32c3_drop_xdp"
partition_table = "examples/esp32c3-drop-xdp/partitions.csv"
chip = "esp32c3"

[[profile]]
id = "firmware"
path = "xdp_pass"
description = "Full XDP DUT — echo / wl / rate / suite (examples/esp32c3-firmware)"
bin = "examples/esp32c3-firmware/target/riscv32imc-unknown-none-elf/release/esp32c3_firmware"
partition_table = "examples/esp32c3-firmware/partitions.csv"
chip = "esp32c3"
