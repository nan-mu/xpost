#   [[fw]]
#   name = "…"
#   target = "esp32c3"
#   partition_table = "examples/…/partitions.csv"
#   artifact = "examples/…/target/…/release/…"
#   build = { cwd = "…", command = ["cargo", …] }
#   xdp = ["xdp_name", …]          # optional; co-flashed after fw
#
#   [[xdp]]
#   name = "…"
