# ---------------------------------------------------------------------------
# case_xdp — one firmware for both exams.
# Cold `case` clears and reflashes one image, then reboots.
# `hot_swap` installs case_swap and case_mark_idle, then publishes without reboot.
# xdp is empty so flash/fw does not pin an image.
# ---------------------------------------------------------------------------

[[fw]]
name = "case-cag"
target = "esp32c3"
partition_table = "examples/case_xdp/partitions.csv"
artifact = "examples/case_xdp/target/riscv32imc-unknown-none-elf/release/case_xdp"
build = { cwd = "examples/case_xdp", command = ["cargo", "build", "--release", "--features", "perf-cag"] }
xdp = []

[[xdp]]
name = "case_swap"
fw = "case-cag"
artifact = "../build/case_swap/case_swap.elf"
build = { cwd = "../libbpf-mcu", command = ["pixi", "run", "build", "--firmware", "../xpost/examples/case_xdp/target/riscv32imc-unknown-none-elf/release/case_xdp", "-c", "case_swap"] }

[[xdp]]
name = "case_mark"
fw = "case-cag"
artifact = "../build/case_mark/case_mark.elf"
build = { cwd = "../libbpf-mcu", command = ["pixi", "run", "build", "--firmware", "../xpost/examples/case_xdp/target/riscv32imc-unknown-none-elf/release/case_xdp", "-c", "case_mark"] }

[[xdp]]
name = "case_mark_idle"
fw = "case-cag"
artifact = "../build/case_mark/case_mark_idle.elf"
build = { cwd = "../libbpf-mcu", command = ["pixi", "run", "build", "--firmware", "../xpost/examples/case_xdp/target/riscv32imc-unknown-none-elf/release/case_xdp", "--slot-symbol", "xdp_slot_idle", "--image-name", "case_mark_idle", "-c", "case_mark"] }
