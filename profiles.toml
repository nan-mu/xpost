# Profile registry for Mac `xpost-agent` FlashProfile (paths relative to xpost/).
# `build` is argv run from XPOST_ROOT before flash so Mac only needs:
#   cargo xtask agent --listen 0.0.0.0:9240 --no-monitor
# (HTTP /v1/flash_profile + /mcp on that port)
#
# Formal firmware tags (DB `firmware` enum — not Cargo feature names):
#   xdp_cag / hal → perf-counter+aggregate+gauge via existing kind-a,kind-g
#   xdp_t         → perf-trace via kind-t
# Do not invent kind-cag. Shard just-*-c/a/g kept only as manual aliases.

# ---------------------------------------------------------------------------
# Formal just_tx (3 images)
# ---------------------------------------------------------------------------

[[profile]]
id = "just-tx-cag"
path = "just_xdp"
description = "just_tx XDP C+A+G (kind-a,kind-g) + cold just_tx.elf — DB tag xdp_cag"
bin = "examples/just_xdp/target/riscv32imc-unknown-none-elf/release/just_xdp"
partition_table = "examples/just_xdp/partitions.csv"
chip = "esp32c3"
xdp_elf = "examples/just_xdp/just_tx.elf"
xdp_name = "just_tx"
build = ["cargo", "xtask", "just_xdp", "build", "--release", "--no-default-features", "--features", "kind-a,kind-g"]

[[profile]]
id = "just-tx-t"
path = "just_xdp"
description = "just_tx XDP Trace (kind-t) + cold just_tx.elf — DB tag xdp_t"
bin = "examples/just_xdp/target/riscv32imc-unknown-none-elf/release/just_xdp"
partition_table = "examples/just_xdp/partitions.csv"
chip = "esp32c3"
xdp_elf = "examples/just_xdp/just_tx.elf"
xdp_name = "just_tx"
build = ["cargo", "xtask", "just_xdp", "build", "--release", "--no-default-features", "--features", "kind-t"]

[[profile]]
id = "just-tx-hal-cag"
path = "just_tx_hal"
description = "just_tx_hal C+A+G (kind-a,kind-g); Pass XDP + app UDP echo — DB tag hal"
bin = "examples/just_tx_hal/target/riscv32imc-unknown-none-elf/release/just_tx_hal"
partition_table = "examples/just_tx_hal/partitions.csv"
chip = "esp32c3"
build = ["cargo", "xtask", "just_tx_hal", "build", "--release", "--no-default-features", "--features", "kind-a,kind-g"]

