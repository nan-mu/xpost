[package]
name = "xpost-build"
version = "0.1.1"
edition = "2024"
publish = false
description = "Board codegen for xpost integrators (layout/mem/bpf.toml → Rust + IRAM linker script)"

# Independent host workspace (parent defaults to RV32).
[workspace]

[lib]
name = "xpost_build"
path = "src/lib.rs"

[[bin]]
name = "xpost-link"
path = "src/bin/xpost-link.rs"

[[bin]]
name = "xpost-link"
path = "src/bin/xpost-link.rs"

[[bin]]
name = "xpost-compact-elf"
path = "src/bin/xpost-compact-elf.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read", "write", "elf"] }
toml = "1.1.3"
xpost-elf = { path = "../xpost-elf" }
heapless = "0.9.3"
