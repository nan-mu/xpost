[package]
name = "xpost-build"
version = "0.1.1"
edition = "2024"
publish = false
description = "Board codegen for xpost integrators (layout/mem/bpf.toml → Rust + IRAM linker script)"

# Independent host workspace (parent defaults to RV32).
[workspace]

[lib]
name = "xpost_build"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
object = { version = "0.36", default-features = false, features = ["read", "elf"] }
toml = "1.1.3"
