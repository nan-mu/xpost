test-common = { path = "../../test/test-common", features = ["host"] }[package]
name = "xpost-agent"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xpost-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fwtest-common = { path = "../../router-probe/fwtest-common", features = ["user"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.40", features = ["io-util", "macros", "rt-multi-thread", "net", "sync", "time", "process", "signal"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
